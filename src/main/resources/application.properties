spring.application.name=detection

# ==========================================
# 1. POSTGRESQL DATABASE CONFIGURATION
# ==========================================
# Replace 'mine_subsidence_db' with your actual database name
spring.datasource.url=jdbc:postgresql://localhost:5432/mine_subsidence_db
spring.datasource.username=postgres
spring.datasource.password=Anish@2604
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 2. JPA & HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# 'update' automatically creates your 'sensor_telemetry' table based on the Entity.
# (Change this to 'validate' or 'none' when moving to production).
spring.jpa.hibernate.ddl-auto=update

# CRITICAL FOR IoT: Keep this 'false'.
# If the ESP32 sends 50 readings a second, printing every SQL insert
# will bottleneck your server's I/O and spam your logs.
spring.jpa.show-sql=false

# ==========================================
# 3. WEBSOCKET CONFIGURATION
# ==========================================
# Injects these values into your WebSocketConfig.java class
app.websocket.endpoint=/ws-telemetry
# Use '*' for local development so your React app on port 3000 isn't blocked by CORS
app.websocket.allowed-origins=*

# ==========================================
# 4. ASYNC THREAD POOL (For the Service Layer)
# ==========================================
# Since we used @Async in SubsidenceDataService, Spring needs rules for the background workers.
# This ensures a flood of hardware data doesn't consume all server memory.
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=Telemetry-Worker-